name: Publish (m3e fork, amd64-only)

# Builds and pushes ghcr.io/jackhp95/silverbullet-m3e on every push to
# m3e-fork. Adapted from upstream's .github/workflows/ci.yml +
# _build.yml, restricted to the one thing this personal fork actually
# needs: a single x86_64-unknown-linux-musl server binary + the slim
# `Dockerfile` image (no Dockerfile.runtime-api — the live space's
# CONFIG.md has zero server-side Runtime API usage, verified 2026-09-15
# against notes.fox.peterson.place's live CONFIG.md), on the one arch the
# homelab (Acer, x86_64-only) actually runs. Dropped versus upstream:
# arm64/armv7/windows/freebsd/macos legs, QEMU, Docker Hub, npm-publish,
# GitHub-release-asset steps, Apple codesigning — none apply to a
# personal single-arch fork.

on:
  push:
    branches: [m3e-fork]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: silverbullet-m3e
  NAMESPACE_GITHUB: jackhp95

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Rust (linux musl amd64 only)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-amd64

      - name: Install musl cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Build client bundle
        run: npm run build

      - name: Build server (release, x86_64-unknown-linux-musl)
        run: cargo build --release -p silverbullet --target x86_64-unknown-linux-musl

      - name: Stage docker binary (matches Dockerfile's TARGETARCH COPY)
        run: cp target/x86_64-unknown-linux-musl/release/silverbullet silverbullet-amd64

      - name: Verify binary is static (no interpreter)
        run: |
          set -euo pipefail
          echo "== silverbullet-amd64 =="; file silverbullet-amd64
          if file silverbullet-amd64 | grep -q "interpreter"; then
            echo "ERROR: dynamically linked (needs a loader); expected static musl"; exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.NAMESPACE_GITHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-{{sha}}
            type=raw,value=latest

      # Uses the stock (unmodified) upstream `Dockerfile` — it just COPYs
      # silverbullet-${TARGETARCH}, and buildx sets TARGETARCH=amd64 for a
      # linux/amd64-only build, matching the binary staged above.
      - name: Build and push (slim, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          file: Dockerfile
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
